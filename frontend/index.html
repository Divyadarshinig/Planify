<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planify - Login</title>

    <link rel="icon" type="image/jpeg" href="images/planify.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <!-- LOGO -->
            <div class="auth-logo">

                <div class="auth-logo-image">
                    <img
                        src="images/planify.jpg"
                        alt="Planify Logo"
                    >
                </div>

                <div class="auth-logo-text">
                    <h2>Planify</h2>
                    <span>Plan. Focus. Grow.</span>
                </div>

            </div>


            <!-- ================= LOGIN ================= -->

            <div id="loginSection">

                <h1>Welcome Back</h1>

                <p class="subtitle">
                    Plan your day. Focus on what matters.
                </p>

                <form id="loginForm">

                    <div class="input-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="loginEmail"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </button>

                </form>

                <p id="message" class="auth-message"></p>

                <p class="switch-text">
                    Don't have an account?
                    <a href="#" id="showRegister">
                        Create one
                    </a>
                </p>

            </div>


            <!-- ================= REGISTER ================= -->

            <div
                id="registerSection"
                style="display: none;"
            >

                <h1>Create Account</h1>

                <p class="subtitle">
                    Start organizing your tasks with Planify.
                </p>


                <form id="registerForm">

                    <div class="input-group">

                        <label for="registerName">
                            Name
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="registerName"
                                placeholder="Enter your name"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="registerEmail"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-shield-halved"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        <i class="fa-solid fa-user-plus"></i>
                        Create Account
                    </button>

                </form>


                <p
                    id="registerMessage"
                    class="auth-message"
                ></p>


                <p class="switch-text">
                    Already have an account?
                    <a href="#" id="showLogin">
                        Login
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
